name: signing_files
on: [push]
jobs:
  signing_files:
    runs-on: ubuntu-latest
    # 'id-token' needs write permission to retrieve the OIDC token, which is required for authentication.
    permissions:
      id-token: write
    steps:
        # This step ensures that your project is available in the workflow environment.
        - uses: actions/checkout@v4
          with:
            persist-credentials: false

        - name: Run dev container
          shell: bash
          run: |
            bash env.sh
            bash env.sh exec "bazel build //:main"
            bash env.sh exec "./bazel-bin/main"
            bash env.sh exec "chmod 777 ./bazel-bin/main"
            ls -lh ./bazel-bin
            ./bazel-bin/main
        
        - uses: sigstore/gh-action-sigstore-python@v3.0.0
          with:
            inputs: ./bazel-bin/main